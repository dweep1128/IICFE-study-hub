<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Founders Lab S1 Test</title><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: orange-and-white sticker lab notebook. White graph-paper ground, chunky ink-bordered "sticker" cards with hard offset shadows, orange accents in a few strengths. */
:root{
  --ink:#2B1B10; --paper:#FFFFFF; --card:#FFFFFF; --muted:#6E5A4B;
  --mint:#D9480F; --mint-soft:#FFEDE0;
  --pink:#F76707; --pink-soft:#FFE4D1;
  --sun:#FFA62B; --sun-soft:#FFF4E6;
  --lilac:#9A3412; --lilac-soft:#FFF0E5;
  --lime:#FFC078; --lime-soft:#FFF8F0;
  --good:#1E9E5A; --bad:#D6336C;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px; --sh:5px 5px 0 var(--ink); --sh-sm:3px 3px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;
  background-image:linear-gradient(rgba(247,103,7,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(247,103,7,.08) 1px,transparent 1px);
  background-size:26px 26px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#FFFFFF}
.wrap{overflow-x:clip;max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.mono{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase}
.muted{color:var(--muted)}
img{max-width:100%}

/* ---------- brand bar ---------- */
.brand{background:#FFFFFF;color:var(--ink);border-bottom:6px solid var(--pink);box-shadow:0 6px 0 var(--sun)}
.brand-in{max-width:980px;margin:0 auto 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fl-logo{height:62px;width:auto;display:block}
.partners{display:flex;align-items:center;gap:10px}
.partners .lbl{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.2;max-width:84px}
.partners img{height:46px;width:auto;display:block}
.partners .x{font-weight:800;color:var(--muted)}
@media (max-width:560px){.fl-logo{height:44px}.partners img{height:32px}}

/* ---------- page tabs ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.tabs a,.tabs span{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:.9rem;padding:7px 14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);box-shadow:var(--sh-sm);transition:transform .12s}
.tabs a:hover{transform:translate(-1px,-1px)}
.tabs .on{background:var(--sun)}
.tabs .num{font-family:var(--f-mono);font-size:.7rem;border:0;padding:0;box-shadow:none;background:none;border-radius:0;opacity:.7}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin:22px 0 26px}
.sess-badge{width:118px;height:118px;border-radius:50%;background:var(--pink);border:3px solid var(--ink);box-shadow:var(--sh);display:grid;place-items:center;text-align:center;color:#fff;transform:rotate(-8deg);animation:wob 6s ease-in-out infinite}
.sess-badge b{display:block;font-family:var(--f-display);font-size:3rem;line-height:.9}
.sess-badge span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(4deg)}}
.hero h1{font-size:clamp(2.1rem,6vw,3.6rem);font-weight:800}
.hero h1 .hl{background:linear-gradient(transparent 58%,var(--sun) 58%);padding:0 .1em}
.hero p.sub{font-size:1.08rem;margin-top:8px;max-width:60ch}
@media (max-width:560px){.hero{grid-template-columns:1fr}.sess-badge{width:92px;height:92px}.sess-badge b{font-size:2.3rem}}

/* ---------- sticker cards ---------- */
.stk{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.stk.mint{background:var(--mint-soft)}.stk.pink{background:var(--pink-soft)}.stk.sun{background:var(--sun-soft)}.stk.lilac{background:var(--lilac-soft)}.stk.lime{background:var(--lime-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:720px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}

/* session card */
.sesscard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.sesscard .it{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 12px}
.sesscard .it .mono{color:var(--muted);font-size:.64rem}
.sesscard .it b{display:block;font-size:1rem}
.mentors{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.mentor{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 12px}
.mentor .av{flex:0 0 44px;height:44px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem}
.mentor b{display:block;line-height:1.25}
.mentor small{color:var(--muted);line-height:1.3;display:block}
@media (max-width:560px){.sesscard{grid-template-columns:1fr 1fr}}

/* ---------- sections ---------- */
.sec{margin-top:34px;scroll-margin-top:16px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-h .tag{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:#fff;padding:3px 9px;border-radius:6px;margin-bottom:6px}
.sec-h h2{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800}
.done-btn{display:inline-flex;align-items:center;gap:8px;border:2.5px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;box-shadow:var(--sh-sm)}
.done-btn .bx{width:18px;height:18px;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center;font-size:.8rem}
.done-btn.on{background:var(--mint)}
.done-btn.on .bx::after{content:"\2713";font-weight:900}
.lead{font-size:1.1rem}
.prose p+p{margin-top:10px}
.prose ul{margin:8px 0 0;padding-left:20px}
.prose li{margin:4px 0}
.callout{margin-top:14px;border:2px dashed var(--ink);border-radius:14px;padding:12px 14px;background:var(--sun-soft)}
.callout .mono{display:block;margin-bottom:2px}

/* progress xp */
.xpbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding:10px 0;border-bottom:2px solid var(--ink);margin:0 0 4px}
.xpbar .row{display:flex;align-items:center;gap:12px}
.xpbar .track{flex:1;height:16px;border:2.5px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.xpbar .fill{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--mint),var(--mint) 10px,var(--lime) 10px,var(--lime) 20px);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.xpbar .xp{font-family:var(--f-mono);font-weight:700;font-size:.8rem;white-space:nowrap}

/* flip cards */
.flip{perspective:900px;cursor:pointer;min-height:190px;background:none;border:0;padding:0;text-align:left;width:100%}
.flip .in{position:relative;width:100%;height:100%;min-height:190px;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;overflow:auto}
.flip .b{transform:rotateY(180deg);background:var(--card)}
.flip .f h3{font-size:1.5rem}
.flip .hint{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75}

/* quick check */
.qc{margin-top:14px;background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:14px}
.qc .q{font-weight:700}
.qc .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qc .opts button{border:2px solid var(--ink);background:var(--paper);border-radius:12px;padding:7px 12px;font-weight:600;font-size:.92rem}
.qc .opts button.right{background:var(--mint);color:#fff}
.qc .opts button.wrong{background:var(--bad);color:#fff;animation:shake .4s}
.qc .fb{margin-top:8px;font-size:.95rem}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--ink);border-radius:14px;padding:10px 18px;font-weight:800;background:var(--sun);box-shadow:var(--sh-sm);transition:transform .1s,box-shadow .1s;font-size:1rem;text-decoration:none}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.mint{background:var(--mint);color:#fff}.btn.pink{background:var(--pink);color:#fff}.btn.lilac{background:var(--lilac);color:#fff}.btn.ghost{background:var(--card)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* chips / glossary */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:6px 12px;background:var(--card);font-weight:600;font-size:.92rem}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.gloss div{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px}
.gloss b{font-family:var(--f-display);font-size:1.08rem;display:block}

/* takeaways */
.takes{display:grid;gap:10px;counter-reset:t}
.takes div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 14px}
.takes div::before{counter-increment:t;content:counter(t);flex:0 0 30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;font-weight:800;display:grid;place-items:center;border:2px solid var(--ink)}

/* forms */
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-weight:700;font-size:.9rem}
.fld input,.fld select,textarea{font:inherit;border:2.5px solid var(--ink);border-radius:12px;padding:9px 12px;background:var(--card);color:var(--ink);width:100%}

/* toast + confetti */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(calc(100% + 60px));visibility:hidden;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:90;transition:transform .3s cubic-bezier(.3,1.4,.5,1);max-width:calc(100vw - 32px);text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}

footer.foot{margin-top:46px;padding-top:16px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

#test{margin-top:20px;scroll-margin-top:80px}
.intro h2{font-size:clamp(1.5rem,4vw,2rem)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding:8px 0;z-index:15}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);font-family:var(--f-mono);font-size:.78rem;font-weight:700;padding:0}
.dot.ans{background:var(--mint);color:#fff}
.dot.cur{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--lilac)}
.clock{font-family:var(--f-mono);font-weight:700;font-size:1.3rem;background:var(--ink);color:var(--sun);border-radius:12px;padding:6px 14px;font-variant-numeric:tabular-nums}
.clock.warn{background:var(--sun);color:var(--ink)}
.clock.crit{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.qq{font-size:clamp(1.25rem,3.6vw,1.6rem);margin:6px 0 14px}
.qopts{display:flex;flex-direction:column;gap:10px}
.qopt{display:flex;gap:12px;align-items:center;text-align:left;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);padding:12px 14px;font-weight:600;box-shadow:var(--sh-sm);transition:transform .1s}
.qopt:hover{transform:translate(-1px,-1px)}
.qopt .ql{flex:0 0 32px;height:32px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;background:var(--paper)}
.qopt.sel{background:var(--lilac-soft)}
.qopt.sel .ql{background:var(--lilac);color:#fff}
.qnav{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.submitrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:2px dashed var(--ink)}
.who{margin-bottom:8px;color:var(--muted)}
.res{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.res > div:last-child{flex:1;min-width:220px}
.res h2{font-size:clamp(1.4rem,4vw,2rem)}
.ring{position:relative;width:150px;height:150px;flex:0 0 150px}
.ring svg{width:100%;height:100%}
.rtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rtxt b{font-family:var(--f-display);font-size:3rem;line-height:1}
.rtxt span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.keybox2{margin-top:18px;text-align:center;background:var(--lilac-soft)}
.keytxt{display:inline-block;font-family:var(--f-mono);font-size:clamp(1.5rem,6vw,2.3rem);font-weight:700;letter-spacing:.12em;background:var(--ink);color:var(--sun);border-radius:14px;padding:10px 22px;margin:10px 0;animation:pop .5s}
.rvs{display:grid;gap:12px}
.rv{background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:12px 14px}
.rv.ok{background:var(--mint-soft)}.rv.no{background:var(--pink-soft)}
.rvh{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.rvi{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.85rem}
.rv p+p{margin-top:4px}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.rules div{background:var(--sun-soft);border:2px solid var(--ink);border-radius:14px;padding:10px 12px}
.rules b{display:block;font-family:var(--f-display);font-size:1.1rem}
.rules span{font-size:.9rem}
@media (max-width:640px){.rules{grid-template-columns:1fr}}
.slip{margin-top:18px}
.slipline{font-family:var(--f-mono);font-size:.85rem;background:var(--card);border:2.5px solid var(--ink);border-radius:12px;padding:12px;word-break:break-word;user-select:all}
#desk{margin-top:40px;border-top:3px solid var(--ink);padding-top:20px}
#desk textarea{margin-top:10px;font-family:var(--f-mono);font-size:.8rem}
.dtable{overflow-x:auto;margin-top:14px}
.dtable table{border-collapse:collapse;width:100%;min-width:620px;background:var(--card);border:2.5px solid var(--ink)}
.dtable th,.dtable td{border:1.5px solid var(--ink);padding:6px 8px;text-align:left;font-size:.88rem}
.dtable th{background:var(--sun-soft)}

<script>
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function el(tag,attrs,html){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='cls')e.className=attrs[k];else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var store={get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var reduceMotion=false;try{reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}

/* toast */
var _tt;function toast(m){var t=$('#toast');if(!t){t=el('div',{id:'toast',role:'status'});document.body.appendChild(t)}t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show')},2200)}

/* confetti */
var Confetti=(function(){var c,ctx,parts=[],run=false;
 var cols=['#F76707','#FFA62B','#D9480F','#FFC078','#9A3412','#2B1B10'];
 function init(){c=document.getElementById('confetti');if(!c){c=el('canvas',{id:'confetti'});document.body.appendChild(c)}ctx=c.getContext('2d');size();window.addEventListener('resize',size)}
 function size(){if(!c)return;var d=window.devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
 function burst(x,y,n){if(reduceMotion)return;if(!c)init();x=x==null?innerWidth/2:x;y=y==null?innerHeight/3:y;n=n||70;
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=3+Math.random()*7;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:4+Math.random()*5,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.3,life:90+Math.random()*40,sq:Math.random()<.5})}
  if(!run){run=true;requestAnimationFrame(tick)}}
 function tick(){ctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(function(p){return p.life>0});
  parts.forEach(function(p){p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.life/30);if(p.sq)ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{ctx.beginPath();ctx.arc(0,0,p.r/1.4,0,7);ctx.fill()}ctx.restore()});
  if(parts.length)requestAnimationFrame(tick);else{run=false;ctx.clearRect(0,0,innerWidth,innerHeight)}}
 return {burst:burst,fromEl:function(e,n){var r=e.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,n)}};})();

/* hash for slips + keys */
function fnv(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function code6(s){var h=fnv(s)^fnv(s.split('').reverse().join('')+'#');return ('000000'+(h>>>0).toString(36).toUpperCase()).slice(-6)}

/* flip cards + quick checks (generic) */
function wireFlips(root){$$('.flip',root).forEach(function(f){f.addEventListener('click',function(){f.classList.toggle('on');f.setAttribute('aria-pressed',f.classList.contains('on'))})})}
function wireQC(root){$$('.qc',root).forEach(function(q){var ans=q.getAttribute('data-a');var why=q.getAttribute('data-why')||'';var fb=$('.fb',q);
 $$('.opts button',q).forEach(function(b,i){b.addEventListener('click',function(){if(q.classList.contains('solved'))return;
  if(String(i)===ans){b.classList.add('right');q.classList.add('solved');fb.innerHTML='<b>Yes!</b> '+why;Confetti.fromEl(b,40)}
  else{b.classList.add('wrong');setTimeout(function(){b.classList.remove('wrong')},450);fb.innerHTML='<b>Not quite.</b> Try another one.'}})})})}

window.TEST={"mode": "real", "session": "s1", "qs": [{"q": "Which of these is the strongest problem to build a startup on?", "o": ["Something that happens once a year to one person", "Something that happens daily to many people who already use a messy workaround", "Something only you find funny", "Something nobody has ever complained about"], "a": 1, "why": "Frequent, widespread, with workarounds: a strong problem."}, {"q": "\"A photo app exactly like Instagram, with nothing different.\" Which test does it fail?", "o": ["Realistic", "Executable", "Unique", "It passes all three"], "a": 2, "why": "A copy with nothing new is not unique."}, {"q": "What does the White hat focus on?", "o": ["Facts, data and information", "Feelings", "New ideas", "Risks"], "a": 0, "why": "White is neutral: facts and numbers only."}, {"q": "What is the Blue hat's job?", "o": ["Listing benefits", "Sharing gut feelings", "Managing the thinking: planning, summing up, deciding next steps", "Finding problems"], "a": 2, "why": "Blue is the organiser of the whole thinking process."}, {"q": "In the Three Why Approach, the first problem you notice is usually...", "o": ["The root cause", "A symptom", "The final solution", "Not important"], "a": 1, "why": "What you see first is a symptom. The whys lead to the root cause."}, {"q": "Airbnb began when its founders rented out...", "o": ["Hotel rooms", "Air mattresses on their floor", "Cars", "Office desks"], "a": 1, "why": "In 2007 they rented air mattresses when hotels were full."}, {"q": "\"Our class builds a full hospital inside school by summer.\" Which test does it fail?", "o": ["Unique", "Executable", "Realistic only", "It passes all three"], "a": 1, "why": "Hospitals exist, but building one is far beyond a student team."}, {"q": "Who created the Six Thinking Hats method?", "o": ["Steve Jobs", "Edward de Bono", "Ratan Tata", "Albert Einstein"], "a": 1, "why": "Edward de Bono described it in his 1985 book Six Thinking Hats."}, {"q": "What is the main rule while brainstorming?", "o": ["Judge every idea at once", "Only the leader speaks", "Produce many ideas fast, without judging them yet", "Stop after one good idea"], "a": 2, "why": "Quantity first; judge and pick later."}, {"q": "Wearing the Red hat, you are allowed to...", "o": ["Share feelings and gut reactions without giving reasons", "Only quote numbers", "Only list risks", "Run the meeting"], "a": 0, "why": "Red is for emotions and instincts."}], "keyA": "SPARK-21", "keyB": "THREE-WHYS", "minutes": 10};
/* Founders Lab tests. window.TEST = {mode:'practice'|'real', session, sessionNo, title, qs:[{q,o:[4],a,why}], keyA, keyB, minutes} */
(function(){
/* Internal slip-verification salt. Do not change. */
var T=window.TEST,SALT='FoundersLab|MSBSS|GCEC|2026',ROOT=$('#test');
var PKEY='fl-'+T.session+'-'+T.mode;
function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+'m '+('0'+s%60).slice(-2)+'s'}
function clock(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function buildOrder(){return shuffle(T.qs.map(function(_,i){return i})).map(function(qi){return {qi:qi,o:shuffle([0,1,2,3])}})}

/* ---------- shared question runner ---------- */
function runner(state,opts){
 var cur=0;
 ROOT.innerHTML='<div class="qtop"><div class="dots"></div>'+(opts.timer?'<div class="clock" id="clock">--:--</div>':'')+'</div><div class="qcard stk"></div><div class="qnav"><button class="btn ghost" id="prevQ">Back</button><button class="btn" id="nextQ">Next</button></div><div class="submitrow"><button class="btn pink" id="subQ">Submit test</button><span class="subnote muted"></span></div>';
 function dots(){$('.dots',ROOT).innerHTML=state.order.map(function(o,i){return '<button class="dot'+(state.ans[i]!=null?' ans':'')+(i===cur?' cur':'')+'" data-i="'+i+'" aria-label="Question '+(i+1)+'">'+(i+1)+'</button>'}).join('');$$('.dot',ROOT).forEach(function(d){d.addEventListener('click',function(){cur=+d.getAttribute('data-i');draw()})})}
 function draw(){var o=state.order[cur],q=T.qs[o.qi];var c=$('.qcard',ROOT);
  c.innerHTML='<span class="mono">Question '+(cur+1)+' of '+state.order.length+'</span><h3 class="qq">'+esc(q.q)+'</h3><div class="qopts">'+o.o.map(function(oi,k){return '<button class="qopt'+(state.ans[cur]===oi?' sel':'')+'" data-oi="'+oi+'"><span class="ql">'+'ABCD'[k]+'</span><span>'+esc(q.o[oi])+'</span></button>'}).join('')+'</div>';
  c.style.animation='none';c.offsetWidth;c.style.animation='slidein .3s';
  $$('.qopt',c).forEach(function(b){b.addEventListener('click',function(){state.ans[cur]=+b.getAttribute('data-oi');opts.save&&opts.save();$$('.qopt',c).forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');dots();upd();
   if(cur<state.order.length-1)setTimeout(function(){if(state.ans[cur]!=null){cur++;draw()}},380)})});
  $('#prevQ').disabled=cur===0;$('#nextQ').disabled=cur===state.order.length-1;dots();upd()}
 function upd(){var n=state.ans.filter(function(a){return a!=null}).length;$('.subnote',ROOT).textContent=n+' of '+state.order.length+' answered';var sb=$('#subQ');delete sb.dataset.sure;sb.textContent='Submit test'}
 $('#prevQ').addEventListener('click',function(){if(cur>0){cur--;draw()}});
 $('#nextQ').addEventListener('click',function(){if(cur<state.order.length-1){cur++;draw()}});
 $('#subQ').addEventListener('click',function(){var sb=$('#subQ');var n=state.ans.filter(function(a){return a!=null}).length;
  if(!sb.dataset.sure){sb.dataset.sure=1;sb.textContent=n<state.order.length?'Only '+n+' answered. Tap again to submit':'Tap again to confirm';return}opts.onSubmit()});
 draw();
 return {redraw:draw}}
function score(state){var s=0;state.order.forEach(function(o,i){if(state.ans[i]===T.qs[o.qi].a)s++});return s}
function ring(sc,n){var p=sc/n;var C=2*Math.PI*52;return '<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#FFE4D1" stroke-width="14"/><circle class="rfill" cx="60" cy="60" r="52" fill="none" stroke="'+(p>=.8?'#D9480F':p>=.5?'#FFA62B':'#9A3412')+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" data-to="'+(C*(1-p))+'" transform="rotate(-90 60 60)"/></svg><div class="rtxt"><b>'+sc+'</b><span>out of '+n+'</span></div></div>'}
function animRing(){var r=$('.rfill',ROOT);if(r)requestAnimationFrame(function(){r.style.transition='stroke-dashoffset 1.2s cubic-bezier(.3,1,.5,1)';r.setAttribute('stroke-dashoffset',r.getAttribute('data-to'))})}
function verdict(sc,n){var p=sc/n;return p===1?'Perfect score! Founder-level thinking.':p>=.8?'Excellent work!':p>=.6?'Good job. Review the ones you missed.':p>=.4?'Not bad. Go back through the Study Notes once more.':'Keep going. Read the Study Notes again and retry.'}

/* ---------- PRACTICE ---------- */
function practice(){
 ROOT.innerHTML='<div class="stk sun intro"><h2>Warm-up round</h2><p style="margin-top:6px">10 questions, no timer, no marks recorded. Answer all of them, then see your score with explanations. Finishing unlocks <b>Lab Key B</b> for the Real Test.</p><button class="btn pink" id="go" style="margin-top:14px">Start practice</button></div>';
 $('#go').addEventListener('click',function(){var st={order:buildOrder(),ans:[]};runner(st,{onSubmit:function(){result(st)}})})}
 function result(st){var sc=score(st),n=st.order.length;store.set(PKEY+'-done',true);
  var rev=st.order.map(function(o,i){var q=T.qs[o.qi],me=st.ans[i],ok=me===q.a;return '<div class="rv '+(ok?'ok':'no')+'"><div class="rvh"><span class="rvi">'+(ok?'&#10003;':'&#10007;')+'</span><b>'+(i+1)+'. '+esc(q.q)+'</b></div><p>'+(ok?'':'Your answer: <s>'+(me==null?'(skipped)':esc(q.o[me]))+'</s><br>')+'Correct: <b>'+esc(q.o[q.a])+'</b></p><p class="muted">'+esc(q.why)+'</p></div>'}).join('');
  ROOT.innerHTML='<div class="stk res">'+ring(sc,n)+'<div><h2>'+verdict(sc,n)+'</h2><p class="muted" style="margin-top:6px">This was practice. Nothing was recorded.</p></div></div>'+
   '<div class="stk keybox2"><span class="mono">Lab Key B unlocked</span><div class="keytxt" id="keyTxt">'+esc(T.keyB)+'</div><p>Write this down. With Lab Key A from the Activities, it opens the Real Test.</p><button class="btn ghost" id="copyKey" style="margin-top:10px">Copy key</button></div>'+
   '<h2 style="margin:28px 0 12px">Review every answer</h2><div class="rvs">'+rev+'</div><div style="margin-top:20px"><button class="btn mint" id="again">Try a new shuffle</button></div>';
  animRing();Confetti.burst(null,null,sc>=8?160:70);
  $('#copyKey').addEventListener('click',function(){copy(T.keyB)});$('#again').addEventListener('click',function(){var s2={order:buildOrder(),ans:[]};runner(s2,{onSubmit:function(){result(s2)}});window.scrollTo(0,0)});window.scrollTo(0,0)}

function copy(t){try{navigator.clipboard.writeText(t).then(function(){toast('Copied')},function(){toast('Copy failed. Select the text instead.')})}catch(e){toast('Copy failed. Select the text instead.')}}

/* ---------- REAL ---------- */
function real(){
 var slip=store.get(PKEY+'-slip',null);if(slip){showSlip(slip,true);return}
 var prog=store.get(PKEY+'-prog',null);if(prog&&prog.order){exam(prog);return}
 var ka=store.get(PKEY+'-keys',null);if(ka){details();return}
 ROOT.innerHTML='<div class="stk lilac intro"><span class="mono">Locked</span><h2>Enter your two Lab Keys</h2><p style="margin-top:6px">Finish the <b>Activities</b> to get Lab Key A and the <b>Practice Test</b> to get Lab Key B.</p>'+
  '<div class="grid2" style="margin-top:14px"><div class="fld"><label for="kA">Lab Key A</label><input id="kA" autocomplete="off" placeholder="from Activities"></div><div class="fld"><label for="kB">Lab Key B</label><input id="kB" autocomplete="off" placeholder="from Practice Test"></div></div>'+
  '<button class="btn pink" id="unlock" style="margin-top:14px">Unlock</button><p class="kerr bad" style="margin-top:8px"></p></div>';
 $('#unlock').addEventListener('click',function(){var a=norm($('#kA').value),b=norm($('#kB').value);
  if(a===norm(T.keyA)&&b===norm(T.keyB)){store.set(PKEY+'-keys',true);Confetti.burst();details()}
  else{var m=[];if(a!==norm(T.keyA))m.push('Lab Key A');if(b!==norm(T.keyB))m.push('Lab Key B');$('.kerr').textContent=m.join(' and ')+(m.length>1?' are':' is')+' not right. Check spelling and try again.';var c=$('.intro');c.style.animation='none';c.offsetWidth;c.style.animation='shake .4s'}})}
function details(){
 ROOT.innerHTML='<div class="stk intro"><span class="mono">Unlocked</span><h2>Who is taking the test?</h2>'+
  '<div class="grid3" style="margin-top:14px"><div class="fld"><label for="sName">Full name</label><input id="sName" maxlength="40" autocomplete="name"></div><div class="fld"><label for="sGrade">Grade</label><select id="sGrade"><option value="">Choose</option><option>9</option><option>10</option><option>11</option></select></div><div class="fld"><label for="sTeam">Team name</label><input id="sTeam" maxlength="30"></div></div>'+
  '<div class="rules"><div><b>'+T.minutes+' minutes</b><span>The timer starts when you tap Start and keeps running if you refresh.</span></div><div><b>10 questions</b><span>Your order is shuffled, so it differs from your neighbour\'s.</span></div><div><b>One try</b><span>You can submit once. You will see only your score.</span></div></div>'+
  '<button class="btn pink" id="startT" style="margin-top:14px">Start the test</button><p class="derr bad" style="margin-top:8px"></p></div>';
 $('#startT').addEventListener('click',function(){var n=$('#sName').value.trim().replace(/\|/g,'/'),g=$('#sGrade').value,t=$('#sTeam').value.trim().replace(/\|/g,'/');
  if(n.length<3||!g||!t){$('.derr').textContent='Please fill in your full name, grade and team.';return}
  var st={name:n,grade:g,team:t,order:buildOrder(),ans:[],t0:Date.now()};store.set(PKEY+'-prog',st);exam(st)})}
function exam(st){var lim=T.minutes*60,done=false;
 var r=runner(st,{timer:true,save:function(){store.set(PKEY+'-prog',st)},onSubmit:submit});
 var who=el('div',{cls:'who mono'},esc(st.name)+' &middot; Grade '+esc(st.grade)+' &middot; '+esc(st.team));ROOT.insertBefore(who,ROOT.firstChild);
 (function tick(){if(done)return;var left=lim-(Date.now()-st.t0)/1000;var c=$('#clock');if(c){c.textContent=clock(left);c.classList.toggle('warn',left<120);c.classList.toggle('crit',left<30)}if(left<=0){toast('Time is up! Submitting...');submit();return}setTimeout(tick,250)})();
 function submit(){if(done)return;done=true;var sc=score(st),secs=Math.min(lim,Math.round((Date.now()-st.t0)/1000));var d=new Date();
  var ts=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  var parts=['FL-'+T.session.toUpperCase(),st.name,'Gr '+st.grade,st.team,sc+'/'+st.order.length,fmt(secs),ts];var c=code6(parts.join('|')+'|'+SALT);parts.push(c);
  var slip={line:parts.join(' | '),score:sc,n:st.order.length,name:st.name,grade:st.grade,team:st.team,time:fmt(secs),ts:ts,code:c};
  store.set(PKEY+'-slip',slip);try{localStorage.removeItem(PKEY+'-prog')}catch(e){}showSlip(slip,false)}}
function showSlip(s,again){
 ROOT.innerHTML='<div class="stk res">'+ring(s.score,s.n)+'<div><h2>'+(again?'You have already taken this test':verdict(s.score,s.n))+'</h2><p class="muted" style="margin-top:6px">'+esc(s.name)+' &middot; Grade '+esc(s.grade)+' &middot; Team '+esc(s.team)+' &middot; time '+esc(s.time)+'</p></div></div>'+
 '<div class="stk sun slip"><span class="mono">Your score slip</span><h3 style="margin:4px 0 8px">Send this to your mentor</h3><p>Copy the whole line below and send it the way your mentor asks (class group or form). The code at the end proves the score is real.</p><div class="slipline" id="slipLine">'+esc(s.line)+'</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="copySlip">Copy score slip</button></div></div>';
 animRing();if(!again)Confetti.burst(null,null,s.score>=8?180:80);$('#copySlip').addEventListener('click',function(){copy(s.line)});window.scrollTo(0,0)}

/* ---------- MENTOR DESK ---------- */
function verify(line){var p=line.split('|').map(function(x){return x.trim()});if(p.length!==8)return null;var c=p.pop();var ok=code6(p.join('|')+'|'+SALT)===c.toUpperCase();return {s:p[0],name:p[1],grade:p[2].replace(/^Gr\s*/,''),team:p[3],score:p[4],time:p[5],ts:p[6],code:c,ok:ok}}
function desk(){var D=$('#desk');if(!D)return;D.hidden=false;
 D.innerHTML='<h2>Mentor desk</h2><p class="muted" style="margin-top:4px">Paste students\' score slips below, one per line. Each slip is checked and turned into a table you can paste into Google Sheets or Excel.</p><textarea id="slips" rows="6" placeholder="FL-S1 | Aarav Sharma | Gr 10 | Rocket | 8/10 | 6m 12s | 2026-10-22 11:40 | ABC123"></textarea><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn mint" id="chk">Check slips</button><button class="btn ghost" id="cpy" disabled>Copy table</button></div><div class="dtable" id="dt"></div>';
 var rows=[];
 $('#chk').addEventListener('click',function(){rows=$('#slips').value.split(/\n+/).map(function(l){return l.trim()}).filter(Boolean).map(function(l){return verify(l)||{bad:l}});
  var seen={};var h='<table><thead><tr><th>Check</th><th>Name</th><th>Grade</th><th>Team</th><th>Score</th><th>Time</th><th>Submitted</th></tr></thead><tbody>';
  rows.forEach(function(r){if(r.bad){h+='<tr class="x"><td>Unreadable</td><td colspan="6">'+esc(r.bad)+'</td></tr>';return}var k=(r.name+r.grade).toLowerCase();var dup=seen[k];seen[k]=1;
   h+='<tr class="'+(r.ok&&r.s==='FL-'+T.session.toUpperCase()?'':'x')+'"><td>'+(r.s!=='FL-'+T.session.toUpperCase()?'Other session':r.ok?(dup?'Valid (repeat)':'Valid'):'Edited / fake')+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.grade)+'</td><td>'+esc(r.team)+'</td><td>'+esc(r.score)+'</td><td>'+esc(r.time)+'</td><td>'+esc(r.ts)+'</td></tr>'});
  $('#dt').innerHTML=h+'</tbody></table>';$('#cpy').disabled=!rows.length});
 $('#cpy').addEventListener('click',function(){var t='Check\tName\tGrade\tTeam\tScore\tTime\tSubmitted\n'+rows.filter(function(r){return !r.bad}).map(function(r){return [r.ok?'Valid':'Invalid',r.name,r.grade,r.team,r.score,r.time,r.ts].join('\t')}).join('\n');copy(t)})}

if(T.mode==='practice')practice();else{real();
 if(location.hash==='#mentordesk')desk();
 window.addEventListener('hashchange',function(){if(location.hash==='#mentordesk')desk()});
 try{window.claude&&window.claude.use&&window.claude.use('user').then(function(u){if(u&&u.isOwner)Promise.resolve(u.isOwner()).then(function(o){if(o)desk()},function(){})},function(){})}catch(e){}}
})();

</script>
</body></html>
